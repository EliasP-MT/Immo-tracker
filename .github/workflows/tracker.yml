name: Immo Tracker

on:
  schedule:
    # Collecte hebdomadaire : chaque lundi à 8h00 UTC
    - cron: "0 8 * * 1"
    # Rapport trimestriel : 1er jour de janv, avr, juil, oct à 9h00 UTC
    - cron: "0 9 1 1,4,7,10 *"
  # Permet de déclencher manuellement depuis l'interface GitHub
  workflow_dispatch:
    inputs:
      force_report:
        description: "Envoyer le rapport maintenant (oui/non)"
        required: false
        default: "non"

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Ce job tourne à chaque schedule mais on filtre l'envoi d'email plus bas
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      # ── 1. Toujours scraper le prix ──────────────────────────────────────
      - name: Scraping du prix m²
        run: python scraper.py

      # ── 2. Commit + push du CSV mis à jour ───────────────────────────────
      - name: Commit des nouvelles données
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv
          git diff --cached --quiet || git commit -m "data: prix m² $(date +'%Y-%m-%d')"
          git push

      # ── 3. Rapport email uniquement le 1er du trimestre ou si forcé ──────
      - name: Envoi du rapport trimestriel
        if: |
          github.event.schedule == '0 9 1 1,4,7,10 *' ||
          github.event.inputs.force_report == 'oui'
        env:
          GMAIL_USER:    ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          EMAIL_TO:      ${{ secrets.EMAIL_TO }}
        run: python report.py
